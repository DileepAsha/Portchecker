services:
  - type: web
    name: portscope
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
